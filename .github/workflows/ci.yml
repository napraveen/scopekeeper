name: ScopeKeeper CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          cd clerk
          uv sync --all-extras

      - name: Lint with Ruff
        run: |
          uv run --directory clerk ruff check src tests

      - name: Typecheck with Mypy (strict)
        run: |
          uv run --directory clerk mypy --strict src tests

      - name: Run Test Suite (Unit, Contract, Integration)
        run: |
          uv run --directory clerk pytest -v --cov=clerk --cov-report=term-missing

      - name: Evaluate Classifier (20 Fixture Asks)
        run: |
          uv run --directory clerk python ../scripts/eval_classifier.py

      - name: Verify acme-portal deterministic seed history
        run: |
          uv run --directory clerk python ../demo-app/seed/seed_history.py
