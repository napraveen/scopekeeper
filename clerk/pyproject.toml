[project]
name = "clerk"
version = "0.1.0"
description = "ScopeKeeper Clerk backend service over Switch Agent Protocol"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "httpx>=0.27.2",
    "httpx-sse>=0.4.0",
    "websockets>=13.1",
    "apscheduler>=3.10.4",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "ruamel.yaml>=0.18.6",
    "gitpython>=3.1.43",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
llm = [
    "google-genai>=0.3.0",
    "anthropic>=0.37.0",
    "openai>=1.52.0",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "time-machine>=2.16.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clerk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
