services:
  clerk:
    build:
      context: .
      dockerfile: clerk/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.example
    volumes:
      - ./config:/app/config:ro
      - ./demo-app:/app/demo-app
    depends_on:
      - preview

  preview:
    image: python:3.12-slim
    working_dir: /app
    command: python scripts/preview_server.py
    ports:
      - "4300:4300"
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: scopekeeper
      POSTGRES_PASSWORD: scopekeeper
      POSTGRES_DB: scopekeeper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
